name: Auto Scraper Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: فحص الكود
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت التبعيات
        run: npm install

      - name: تثبيت متصفح Chrome لـ Puppeteer
        run: npx puppeteer browsers install chrome

      - name: تشغيل الكاشط وتحديث Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper.js
